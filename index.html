<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201529"><meta name="description" content="استوديو المكياج الافتراضي المباشر"><link rel="manifest" href="manifest.webmanifest"><title>مرآتي | استوديو المكياج</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div><span class="eyebrow">استوديو المكياج الافتراضي</span><h1>مرآتي <span>✦</span></h1><p>مكياجك على ملامحك الحقيقية، مباشرةً بالكاميرا</p></div><span class="version">V1.0.3</span></header><section class="studio"><div class="viewer" id="viewer"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div id="empty" class="empty"><div class="mirror">✧</div><strong>مرآتك جاهزة</strong><p>افتحي الكاميرا أو اختاري صورة لتجربة المكياج</p></div><span id="status" class="status">بانتظار التشغيل</span></div><div class="actions"><button id="cameraBtn" class="primary">📷 فتح الكاميرا</button><label class="upload">▧ اختيار صورة<input type="file" id="upload" accept="image/*" hidden></label><button id="flipBtn" title="تبديل الكاميرا">↺</button></div><div class="actions"><button id="captureBtn" class="primary" disabled>● تصوير بالمكياج</button><button id="compareBtn" disabled>قبل / بعد</button><button id="downloadBtn" disabled>↓ حفظ الصورة</button></div></section><section class="controls"><div class="heading"><h2>تفاصيل الإطلالة</h2><button id="resetBtn">إعادة ضبط</button></div><div class="tabs"><button class="tab active" data-tab="eyes">العيون</button><button class="tab" data-tab="lips">الشفاه</button><button class="tab" data-tab="cheeks">الخدود</button></div><div id="eyes" class="panel active"><label>لون الشدو <input id="shadowColor" type="color" value="#ba7199"></label><label>كثافة الشدو <output id="shadowVal">45%</output><input id="shadow" type="range" min="0" max="100" value="45"></label><label>كثافة الكحل <output id="linerVal">65%</output><input id="liner" type="range" min="0" max="100" value="65"></label><label>رموش طرفية ناعمة <output id="lashVal">25%</output><input id="lash" type="range" min="0" max="100" value="25"></label></div><div id="lips" class="panel"><label>لون الحمرة <input id="lipColor" type="color" value="#a85c75"></label><label>كثافة الحمرة <output id="lipVal">60%</output><input id="lip" type="range" min="0" max="100" value="60"></label><label>لمعان الشفاه <output id="glossVal">30%</output><input id="gloss" type="range" min="0" max="100" value="30"></label></div><div id="cheeks" class="panel"><label>لون البلاشر <input id="blushColor" type="color" value="#d87c8d"></label><label>كثافة البلاشر <output id="blushVal">30%</output><input id="blush" type="range" min="0" max="100" value="30"></label></div><p class="privacy">🔒 تُعالج صور الوجه داخل جهازك. لا تُرفع الصور إلى خادمنا.</p></section><footer>مرآتي — تجربة مكياج قابلة للتخصيص، وليست فلترًا جاهزًا.</footer></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script src="app.js"></script></body></html>
